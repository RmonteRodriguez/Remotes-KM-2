<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Remote Insurance KM</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="output.css">
</head>

<body>

<div class="flex flex-col h-screen">

  <!-- HEADER -->
  <header class="flex items-center justify-between w-full px-6 py-3 bg-gray-900 text-white shrink-0">

    <div class="text-lg font-semibold">
      Remote Insurance
    </div>
  </header>
  <section class="p-2">
    <div id="openTabs"></div>
  </section>

  <!-- MAIN AREA -->
  <div class="flex flex-1 overflow-hidden p-4">

    <!-- SEARCH VIEW (FULL FLEX CONTAINER) -->
    <div id="searchView" class="flex w-full">

      <!-- LEFT FILTER PANEL (25%) -->
      <div class="w-1/4 shrink-0 space-y-4">
        <div>
          <label for="state" class="block text-sm/6 font-medium text-gray-900">Search </label>
          <div class="mt-2 grid grid-cols-1">
            <input id="search" type="text" name="text"  placeholder="Search knowledge..." aria-label="text" class="block w-full rounded-md bg-white px-3 py-1.5 text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-black-600 sm:text-sm/6" />
          </div>
        </div>

        <div>
          <label for="state" class="block text-sm/6 font-medium text-gray-900">State</label>
          <div class="mt-2 grid grid-cols-1">
            <select id="stateSelect" name="state" class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-black-600 sm:text-sm/6">
              <option value="">All States</option>
              <option value="AL">Alabama</option>
              <option value="AK">Alaska</option>
              <option value="AZ">Arizona</option>
              <option value="AR">Arkansas</option>
              <option value="CA">California</option>
              <option value="CO">Colorado</option>
              <option value="CT">Connecticut</option>
              <option value="DE">Delaware</option>
              <option value="FL">Florida</option>
              <option value="GA">Georgia</option>
              <option value="HI">Hawaii</option>
              <option value="ID">Idaho</option>
              <option value="IL">Illinois</option>
              <option value="IN">Indiana</option>
              <option value="IA">Iowa</option>
              <option value="KS">Kansas</option>
              <option value="KY">Kentucky</option>
              <option value="LA">Louisiana</option>
              <option value="ME">Maine</option>
              <option value="MD">Maryland</option>
              <option value="MA">Massachusetts</option>
              <option value="MI">Michigan</option>
              <option value="MN">Minnesota</option>
              <option value="MS">Mississippi</option>
              <option value="MO">Missouri</option>
              <option value="MT">Montana</option>
              <option value="NE">Nebraska</option>
              <option value="NV">Nevada</option>
              <option value="NH">New Hampshire</option>
              <option value="NJ">New Jersey</option>
              <option value="NM">New Mexico</option>
              <option value="NY">New York</option>
              <option value="NC">North Carolina</option>
              <option value="ND">North Dakota</option>
              <option value="OH">Ohio</option>
              <option value="OK">Oklahoma</option>
              <option value="OR">Oregon</option>
              <option value="PA">Pennsylvania</option>
              <option value="RI">Rhode Island</option>
              <option value="SC">South Carolina</option>
              <option value="SD">South Dakota</option>
              <option value="TN">Tennessee</option>
              <option value="TX">Texas</option>
              <option value="UT">Utah</option>
              <option value="VT">Vermont</option>
              <option value="VA">Virginia</option>
              <option value="WA">Washington</option>
              <option value="WV">West Virginia</option>
              <option value="WI">Wisconsin</option>
              <option value="WY">Wyoming</option>
            </select>
            <svg viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4">
              <path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd" />
            </svg>
          </div>
        </div>
        <div>
          <label for="business" class="block text-sm/6 font-medium text-gray-900">Lines of Business</label>
          <div class="mt-2 grid grid-cols-1">
            <select id="businessSelect" name="business" class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-black-600 sm:text-sm/6">
              <option value="">All Lines</option>
              <option>Auto</option>
              <option>Boat</option>
              <option>Motor Home</option>
              <option>Travel Trailer</option>
              <option>Motorcycle</option>
              <option>Renters</option>
            </select>
            <svg viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4">
              <path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd" />
            </svg>
          </div>
        </div>

        <div>
          <label for="company" class="block text-sm/6 font-medium text-gray-900">Location</label>
          <div class="mt-2 grid grid-cols-1">
            <select id="companySelect" name="company" class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-black-600 sm:text-sm/6">
              <option value="">All Companies</option>
            </select>
            <svg viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4">
              <path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd" />
            </svg>
          </div>
        </div>

        <button id="generateSummaryBtn" class="w-full p-2 bg-black text-white rounded mt-4">
          Generate AI Summary
        </button>
      </div>

      <!-- RIGHT SEARCH PANEL (75%) -->
      <div class="w-3/4 p-4 overflow-y-auto">
        <div id="aiSummary" class="ai-summary hidden">
          <div class="ai-summary-title">AI Summary</div>
          <div id="aiSummaryText"></div>
          <div id="aiSources"></div>
        </div>

        <div id="results"></div>
      </div>
    </div>

    <!-- DOCUMENT VIEW -->
    <div id="docView" class="view hidden w-full">

      <div id="docTitle"></div>
      <div id="docContent" class="mb-4"></div>

      <hr/>

      <div class="ai-box w-full mt-4">
        <label for="comment" class="block text-sm/6 font-medium text-gray-900">Add your comment</label>
        <div class="mt-2">
          <textarea class="block w-full rounded-md bg-white px-3 py-1.5 text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-gray-600 text-sm/6" id="docQuestion" placeholder="Ask this document..."></textarea>
        </div>
        <button id="askBtn" class="w-full p-2 bg-black text-white rounded mt-4">Ask</button>
      <div id="aiAnswer"></div> 

    </div>

  </div>

</div>
<!-- CHATBOT WIDGET -->
<div id="chatbot">
  
  <div id="chatHeader">
    Doc Assistant
    <button id="chatToggleBtn">−</button>
  </div>

  <div id="chatMessages"></div>

  <div id="chatInputArea">
    <input id="chatInput" type="text" placeholder="Ask something..." />
    <button id="chatSendBtn">Send</button>
  </div>

</div>

<script type="module" src="app.js"></script>
<script src="docs.js"></script>
</body>
</html>
